<svg class="character" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <title>JUNGKANG0911個人網站人物插圖</title>
  <desc>代表 JUNGKANG0911個人品牌的首頁人物插圖。</desc>
  <style><![CDATA[
    .float { animation: float 5s ease-in-out infinite; transform-origin: center; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .breathe { animation: breathe 4s ease-in-out infinite; transform-origin: center; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }
  ]]></style>
      <defs>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ff7a52"/>
          <stop offset="100%" stop-color="#ff5b2e"/>
        </linearGradient>
        <radialGradient id="cheekGrad">
          <stop offset="0%" stop-color="#ff5b2e" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#ff5b2e" stop-opacity="0"/>
        </radialGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
          <feOffset dy="6" result="off"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Decorative orbits -->
      <g class="orbit-group" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.25">
        <circle cx="250" cy="260" r="200" stroke-dasharray="2 6"/>
      </g>

      <!-- Floating star accent -->
      <g id="starGroup" transform="translate(400 110)">
        <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z" fill="#ff5b2e"/>
      </g>
      <g id="starGroup2" transform="translate(80 380)">
        <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#2a2af0"/>
      </g>

      <!-- Body group (floats) -->
      <g class="float">

        <!-- Shadow on ground -->
        <ellipse id="groundShadow" cx="250" cy="460" rx="110" ry="14" fill="#1a1a1a" opacity="0.15"/>

        <!-- Body torso (breathing) -->
        <g class="breathe">
          <!-- Legs -->
          <path d="M210 380 Q205 430 215 455 L235 455 Q240 420 235 380 Z" fill="#1a1a1a"/>
          <path d="M290 380 Q295 430 285 455 L265 455 Q260 420 265 380 Z" fill="#1a1a1a"/>

          <!-- Body / shirt -->
          <path d="M180 250
                   Q170 240 175 230
                   Q190 220 200 218
                   L300 218
                   Q310 220 325 230
                   Q330 240 320 250
                   L320 380
                   L180 380 Z"
                fill="url(#bodyGrad)" filter="url(#softShadow)"/>

          <!-- Shirt detail line -->
          <path d="M250 230 L250 380" stroke="#1a1a1a" stroke-width="1.2" opacity="0.25" stroke-dasharray="3 4"/>

          <!-- Pocket square -->
          <rect x="290" y="260" width="22" height="6" rx="2" fill="#f3efe6" opacity="0.9"/>

          <!-- Left arm (static-ish, slight sway) -->
          <g id="leftArm" style="transform-origin: 195px 240px;">
            <path d="M195 240 Q170 290 175 360" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round" fill="none"/>
            <circle cx="173" cy="362" r="14" fill="#f3d2bd"/>
          </g>

          <!-- Right arm (waves) -->
          <g id="rightArm" style="transform-origin: 305px 240px;">
            <path d="M305 240 Q345 245 360 200" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round" fill="none"/>
            <circle cx="362" cy="195" r="16" fill="#f3d2bd"/>
            <!-- fingers hint -->
            <path d="M353 184 L358 174 M362 180 L367 169 M370 182 L376 174" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Neck -->
          <rect x="232" y="200" width="36" height="28" fill="#f3d2bd"/>
          <ellipse cx="250" cy="226" rx="22" ry="6" fill="#1a1a1a" opacity="0.18"/>

        </g>

        <!-- HEAD (head movement separate) -->
        <g id="head">
          <!-- Hair back -->
          <path d="M180 130 Q175 90 215 75 Q250 55 290 80 Q325 92 320 145 L320 165 L180 165 Z"
                fill="#1a1a1a"/>

          <!-- Face -->
          <ellipse cx="250" cy="160" rx="68" ry="78" fill="#f3d2bd" filter="url(#softShadow)"/>

          <!-- Hair front fringe -->
          <path d="M188 135 Q200 100 250 95 Q300 100 312 135 Q300 120 270 124 Q240 110 215 130 Q200 132 188 135 Z"
                fill="#1a1a1a"/>

          <!-- Ears -->
          <ellipse cx="184" cy="165" rx="8" ry="14" fill="#f3d2bd"/>
          <ellipse cx="316" cy="165" rx="8" ry="14" fill="#f3d2bd"/>

          <!-- Cheeks -->
          <circle cx="215" cy="180" r="14" fill="url(#cheekGrad)"/>
          <circle cx="285" cy="180" r="14" fill="url(#cheekGrad)"/>

          <!-- Eyebrows -->
          <path id="browL" d="M210 145 Q222 140 232 145" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path id="browR" d="M268 145 Q278 140 290 145" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

          <!-- Eyes (whites + pupils) -->
          <g id="eyeL">
            <ellipse cx="222" cy="165" rx="9" ry="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
            <circle id="pupilL" cx="222" cy="165" r="4.5" fill="#1a1a1a"/>
            <circle cx="223.5" cy="163" r="1.4" fill="#fff"/>
          </g>
          <g id="eyeR">
            <ellipse cx="278" cy="165" rx="9" ry="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
            <circle id="pupilR" cx="278" cy="165" r="4.5" fill="#1a1a1a"/>
            <circle cx="279.5" cy="163" r="1.4" fill="#fff"/>
          </g>

          <!-- Eye lids (for blink) -->
          <rect id="lidL" x="211" y="154" width="22" height="0" fill="#f3d2bd" />
          <rect id="lidR" x="267" y="154" width="22" height="0" fill="#f3d2bd" />

          <!-- Nose -->
          <path d="M250 175 Q246 188 250 195 Q254 198 258 195" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

          <!-- Mouth (animated) -->
          <path id="mouth" d="M236 210 Q250 222 264 210" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>

      </g>

      <!-- Speech bubble -->
      <g id="bubble" opacity="0" transform="translate(380 80)">
        <rect x="-50" y="-22" width="100" height="36" rx="18" fill="#1a1a1a"/>
        <path d="M-30 14 L-38 26 L-22 18 Z" fill="#1a1a1a"/>
        <text x="0" y="3" fill="#f3efe6" font-family="Fraunces, serif" font-style="italic" font-size="16" text-anchor="middle">hi 👋</text>
      </g>
    </svg>
